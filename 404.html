<title>找不到這一頁</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20class%3D%22vinyl%22%20viewBox%3D%220%200%2024%2024%22%20width%3D%2232%22%20height%3D%2232%22%20aria-hidden%3D%22true%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%2211.2%22%20fill%3D%22%23141414%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%228.6%22%20fill%3D%22none%22%20stroke%3D%22%23333%22%20stroke-width%3D%22.8%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%226.6%22%20fill%3D%22none%22%20stroke%3D%22%23333%22%20stroke-width%3D%22.8%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%224.3%22%20fill%3D%22%232ec4b6%22%2F%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%221%22%20fill%3D%22%230a2447%22%2F%3E%3C%2Fsvg%3E">
<!--
  GitHub Pages 的網址路徑是區分大小寫的，而倉庫名稱不是 ——
  所以 /EarSleuth/ 跟 /earsleuth/ 在 GitHub 眼中是同一個倉庫，
  但只有後者打得開。倉庫改過名字的話，舊連結、舊書籤、手機桌面捷徑
  就會全部變成 404，而且沒辦法從已經存起來的連結那邊修。

  使用者站台（這個倉庫）的 404 頁會接住整個網域上所有對不上的路徑，
  所以在這裡把大小寫喬回來，舊連結就救得回來了。
-->
<script>
(function(){
  // 實際存在的站台。比對時不分大小寫，轉址時用這裡寫的正確寫法。
  var 站台 = ['earsleuth', 'Song_Guessing_Game'];

  var 路徑 = location.pathname.replace(/^\/+/, '');
  var 第一段 = 路徑.split('/')[0];
  if(!第一段) return;

  for(var i = 0; i < 站台.length; i++){
    if(第一段.toLowerCase() !== 站台[i].toLowerCase()) continue;
    // 大小寫本來就對的話不要跳 —— 那代表站台本身真的有問題，
    // 跳過去只會變成無限轉圈
    if(第一段 === 站台[i]) return;
    var 新路徑 = '/' + 站台[i] + 路徑.slice(第一段.length);
    location.replace(新路徑 + location.search + location.hash);
    return;
  }
})();
</script>
